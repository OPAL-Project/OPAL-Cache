version: '3'
services:
    mongodb:
        image: mongo:latest@sha256:41a529c5c0130d23043be1634dbec8be661cc6fba392d8e2d9637b5038545db4
        environment:
            - MONGO_DATA_DIR=/data/mongodb
            - MONGO_LOG_DIR=/dev/null
            - MONGODB_DBNAME=opal
        command: mongod --smallfiles --logpath=/dev/null # --quiet
        ports:
            - 27017:27017

    cache:
        build:
            context: .
        depends_on:
            - mongodb
        links:
            - mongodb
        ports:
            - 80:80
